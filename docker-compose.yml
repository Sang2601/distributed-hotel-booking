# Distributed Hotel Booking – chạy toàn bộ hệ thống bằng một lệnh:
#   docker compose up -d --build
#
# Cổng mở ra máy host:
#   5500  frontend (nginx)
#   8088  load-balancer (nginx) → 2 instance api-gateway
#   8761  Eureka dashboard (danh sách instance đã đăng ký)
#   3000  Grafana (dashboard giám sát + log)
#   9090  Prometheus
#   15672 RabbitMQ Management UI (guest / guest)
# Các service còn lại chỉ nói chuyện với nhau trong mạng Docker.

name: hotel-booking

x-db-credentials: &db-credentials
  DB_USERNAME: ${POSTGRES_USER:-hotel}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel123}

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 450m
  healthcheck: &spring-healthcheck
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 60s

x-eureka: &eureka-env
  EUREKA_URL: http://discovery-server:8761/eureka

services:

  # ================= HẠ TẦNG =================

  # Chương 7: node PRIMARY – nhận mọi thao tác ghi
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel123}
      POSTGRES_DB: postgres
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mỗi service một database riêng (database-per-service)
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      # User + quyền cho replica
      - ./infra/postgres/02-replication.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Chương 7: node REPLICA – bản sao thời gian thực (streaming replication), chỉ đọc
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    user: root
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica123}
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Chương 4: cache danh sách phòng; Chương 6: khoá phân tán
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chương 7: sao lưu tự động bằng pg_dump, đọc từ REPLICA để không làm nặng primary
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres-replica
      RESTORE_HOST: postgres
      PGUSER: ${POSTGRES_USER:-hotel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hotel123}
      BACKUP_DATABASES: "userdb bookingdb paymentdb roomdb"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - ./backups:/backups
      - ./scripts/backup:/scripts:ro
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    depends_on:
      postgres-replica:
        condition: service_healthy

  # ================= SERVICE REGISTRY (Chương 5) =================

  discovery-server:
    <<: *spring-service
    build: ./services/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]

  # ================= MICROSERVICES =================

  user-service:
    <<: *spring-service
    build: ./services/user-service
    environment:
      <<: [*db-credentials, *eureka-env]
      DB_URL: jdbc:postgresql://postgres:5432/userdb
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  auth-service:
    <<: *spring-service
    build: ./services/auth-service
    environment:
      <<: *eureka-env
      JWT_SECRET: ${JWT_SECRET:-hotel-booking-secret-key-1234567890-abcdef}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
    depends_on:
      discovery-server:
        condition: service_healthy

  # Chương 8: 2 instance, chia tải qua Eureka + Spring Cloud LoadBalancer
  room-service:
    <<: *spring-service
    build: ./services/room-service
    deploy:
      replicas: 2
    environment:
      <<: [*db-credentials, *eureka-env]
      DB_URL: jdbc:postgresql://postgres:5432/roomdb
      REDIS_HOST: redis
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # Chương 6, 8: 2 instance; khoá Redis đảm bảo không đặt trùng dù request rơi vào instance nào
  booking-service:
    <<: *spring-service
    build: ./services/booking-service
    deploy:
      replicas: 2
    environment:
      <<: [*db-credentials, *eureka-env]
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      BOOKING_PAYMENT_TIMEOUT_MINUTES: ${BOOKING_PAYMENT_TIMEOUT_MINUTES:-15}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  payment-service:
    <<: *spring-service
    build: ./services/payment-service
    environment:
      <<: [*db-credentials, *eureka-env]
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      RABBITMQ_HOST: rabbitmq
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # Chương 8: 2 instance gateway phía sau load-balancer
  api-gateway:
    <<: *spring-service
    build: ./services/api-gateway
    deploy:
      replicas: 2
    environment:
      <<: *eureka-env
      JWT_SECRET: ${JWT_SECRET:-hotel-booking-secret-key-1234567890-abcdef}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
    depends_on:
      discovery-server:
        condition: service_healthy

  # Chương 8: cửa vào duy nhất, chia tải + failover giữa các api-gateway
  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./infra/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8088/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api-gateway:
        condition: service_healthy

  # ================= GIÁM SÁT (Chương 8) =================

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      discovery-server:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hotel-booking.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # ================= FRONTEND =================

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - load-balancer

volumes:
  pgdata:
  pgdata-replica:
