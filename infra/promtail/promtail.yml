# Chương 8 – Log management: Promtail đọc log của mọi container qua Docker API rồi đẩy về Loki.
# Grafana → Explore → Loki để tìm log của toàn hệ thống ở một chỗ, lọc theo service / mức log.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=hotel-booking"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Log Spring Boot: "2026-11-14T01:40:16.503Z  INFO 1 --- [...]" → nhãn level=INFO
      - regex:
          expression: '^\S+\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+\d+\s+---'
      - labels:
          level:
