# Chương 8 – Load balancer + failover phía trước các instance api-gateway.
#
# Docker DNS trả về IP của MỌI replica api-gateway; tham số "resolve" (nginx >= 1.27.3) làm nginx
# hỏi lại DNS mỗi 5 giây, nên replica mới bật / replica khởi động lại với IP mới đều được nhận.
# Thuật toán: round-robin. Một instance lỗi 1 lần thì tạm loại (passive health check).

resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_gateway {
    zone api_gateway 64k;
    server api-gateway:8088 resolve max_fails=1 fail_timeout=10s;
}

# Hỗ trợ nâng cấp kết nối lên WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8088;

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_read_timeout 3600s;   # giữ kết nối WebSocket lâu dài

        # Failover: instance không kết nối được / trả 502, 503 thì chuyển request sang instance khác.
        # Mặc định nginx KHÔNG thử lại POST/PUT, nên không có nguy cơ đặt phòng hai lần.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        # Cho biết instance gateway nào đã xử lý (minh hoạ cân bằng tải)
        add_header X-Gateway-Upstream $upstream_addr always;
    }
}
