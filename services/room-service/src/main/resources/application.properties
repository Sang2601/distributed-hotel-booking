spring.application.name=room-service

# =========================
# SERVER
# =========================
server.port=8083

# =========================
# DATABASE
# Chạy local: H2 in-memory. Chạy Docker: PostgreSQL (DB_URL/DB_USERNAME/DB_PASSWORD)
# =========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:roomdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# JPA
# Chạy 2 instance dùng chung database: KHÔNG xoá bảng khi khởi động (update thay vì create)
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================
# SQL INIT: data.sql chỉ chèn phòng chưa có. Nếu 2 instance cùng chèn một phòng,
# instance chậm hơn gặp lỗi trùng khoá chính và bỏ qua câu đó.
# =========================
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# =========================
# CHƯƠNG 4: REDIS CACHE
# =========================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# Redis chết thì chờ tối đa 500ms rồi bỏ qua cache, đọc thẳng database
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.redis.time-to-live=10m
spring.cache.redis.enable-statistics=true
# Khai báo trước tên cache để Micrometer gắn metrics hit/miss ngay khi khởi động (Grafana)
spring.cache.cache-names=rooms,roomSearch,room
# Redis tạm chết không làm room-service bị báo DOWN
management.health.redis.enabled=false

# Chương 8: health check
management.endpoints.web.exposure.include=health,info,prometheus

# ==============================
# CHƯƠNG 5: SERVICE REGISTRY (EUREKA)
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# Làm mới danh sách instance thường xuyên để bỏ nhanh instance đã chết
spring.cloud.loadbalancer.cache.ttl=5s

# ==============================
# CHƯƠNG 8: METRICS CHO PROMETHEUS
# ==============================
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
