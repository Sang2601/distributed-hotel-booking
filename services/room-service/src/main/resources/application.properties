spring.application.name=room-service

# =========================
# SERVER
# =========================
server.port=8083

# =========================
# DATABASE
# Chạy local: H2 in-memory. Chạy Docker: PostgreSQL (DB_URL/DB_USERNAME/DB_PASSWORD)
# =========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:roomdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# JPA
# Danh sách phòng là dữ liệu mẫu cố định: tạo lại bảng và nạp data.sql mỗi lần khởi động
# =========================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================
# SQL INIT
# =========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Chương 8: health check
management.endpoints.web.exposure.include=health,info
