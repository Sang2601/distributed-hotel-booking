spring.application.name=user-service

# SERVER
server.port=8081

# DATABASE
# Chạy local: H2 in-memory. Chạy Docker: PostgreSQL (truyền qua DB_URL/DB_USERNAME/DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 CONSOLE (chỉ dùng khi chạy H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Chương 8: health check
management.endpoints.web.exposure.include=health,info,prometheus

# ==============================
# CHƯƠNG 5: SERVICE REGISTRY (EUREKA)
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# Làm mới danh sách instance thường xuyên để bỏ nhanh instance đã chết
spring.cloud.loadbalancer.cache.ttl=5s

# ==============================
# CHƯƠNG 8: METRICS CHO PROMETHEUS
# ==============================
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
