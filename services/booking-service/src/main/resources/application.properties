# ==============================
# BOOKING SERVICE CONFIGURATION
# ==============================

spring.application.name=booking-service

# SERVER
server.port=8082

# ==============================
# DATABASE
# Chạy local: H2 in-memory. Chạy Docker: PostgreSQL (DB_URL/DB_USERNAME/DB_PASSWORD)
# ==============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================
# H2 CONSOLE (chỉ dùng khi chạy H2)
# ==============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================
# TÊN LOGIC CỦA SERVICE KHÁC (Eureka + LoadBalancer phân giải)
# ==============================
services.room-url=${ROOM_SERVICE_URL:http://room-service}

# ==============================
# CHƯƠNG 3: TIẾN TRÌNH & LUỒNG
# ==============================
# Booking chưa thanh toán sau N phút sẽ bị tự động huỷ
booking.payment-timeout-minutes=${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}
# Chu kỳ quét booking quá hạn (ms)
booking.expiry-check-interval-ms=60000
# Thread pool cho các job @Scheduled: xem config/SchedulingConfig.java

# ==============================
# CHƯƠNG 2, 4: RABBITMQ
# ==============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Nhiều luồng consumer xử lý message song song
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
# Thử lại 3 lần, vẫn lỗi thì đẩy sang dead-letter queue thay vì lặp vô hạn
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==============================
# CHƯƠNG 6: KHOÁ PHÂN TÁN REDIS (Redisson)
# ==============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# ==============================
# CHƯƠNG 8: TÍNH CHỊU LỖI
# ==============================
management.endpoints.web.exposure.include=health,info,circuitbreakers,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# RabbitMQ tạm mất kết nối không làm cả service bị báo DOWN
management.health.rabbit.enabled=false

resilience4j.circuitbreaker.instances.roomService.sliding-window-size=10
resilience4j.circuitbreaker.instances.roomService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.roomService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.roomService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.roomService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.roomService.register-health-indicator=true
resilience4j.circuitbreaker.instances.roomService.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.roomService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# ==============================
# CHƯƠNG 5: SERVICE REGISTRY (EUREKA)
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# Làm mới danh sách instance thường xuyên để bỏ nhanh instance đã chết
spring.cloud.loadbalancer.cache.ttl=5s

# ==============================
# CHƯƠNG 8: METRICS CHO PROMETHEUS
# ==============================
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
