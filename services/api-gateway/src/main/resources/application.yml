server:
  port: 8088

# Chương 5: dùng chung secret với auth-service để kiểm tra chữ ký JWT
jwt:
  secret: ${JWT_SECRET:hotel-booking-secret-key-1234567890-abcdef}

# Địa chỉ các service. Chạy local dùng localhost, chạy Docker dùng tên service (Docker DNS)
services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8080}
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  room-url: ${ROOM_SERVICE_URL:http://localhost:8083}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - https://*.app.github.dev
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: ${services.auth-url}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: ${services.user-url}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: booking-service
          uri: ${services.booking-url}
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1

        - id: room-service
          uri: ${services.room-url}
          predicates:
            - Path=/api/rooms/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: ${services.payment-url}
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
