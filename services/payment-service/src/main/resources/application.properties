spring.application.name=payment-service
server.port=8084

# DATABASE
# Chạy local: H2 in-memory. Chạy Docker: PostgreSQL (DB_URL/DB_USERNAME/DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gọi thẳng service khác bằng tên logic, Eureka + LoadBalancer chọn instance (không vòng qua Gateway)
services.booking-url=${BOOKING_SERVICE_URL:http://booking-service}
services.room-url=${ROOM_SERVICE_URL:http://room-service}

# RABBITMQ (Chương 2, 4)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Không chờ lâu khi RabbitMQ chết, để kịp chuyển sang fallback REST
spring.rabbitmq.connection-timeout=3s

# CHƯƠNG 8: TÍNH CHỊU LỖI
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.rabbit.enabled=false

# Thử lại tối đa 3 lần khi lỗi mạng / 5xx; lỗi 4xx (vd. booking không tồn tại) thì không thử lại
resilience4j.retry.instances.downstream.max-attempts=3
resilience4j.retry.instances.downstream.wait-duration=500ms
resilience4j.retry.instances.downstream.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.bookingService.base-config=default
resilience4j.circuitbreaker.instances.roomService.base-config=default

# ==============================
# CHƯƠNG 5: SERVICE REGISTRY (EUREKA)
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# Làm mới danh sách instance thường xuyên để bỏ nhanh instance đã chết
spring.cloud.loadbalancer.cache.ttl=5s

# ==============================
# CHƯƠNG 8: METRICS CHO PROMETHEUS
# ==============================
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
